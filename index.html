<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetra Farm & PopInStock</title>
<style>
:root { --bg: #0a0a12; --card: #161622; --sidebar: #12121a; --text: #e8e8f0; --muted: #a0a0b0; --magenta: #ff2e93; --cyan: #00f5ff; --lime: #39ff14; --gold: #ffd700; --purple: #a855f7; --orange: #ff6b35; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.top-nav { display: flex; justify-content: center; gap: 12px; padding: 12px; background: var(--sidebar); border-bottom: 1px solid #2a2a3a; position: sticky; top: 0; z-index: 20; }
.nav-btn { padding: 8px 22px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; background: #222; color: var(--text); }
.nav-btn.active { background: linear-gradient(90deg, var(--magenta), var(--purple)); color: white; }
.commands-bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 10px; background: var(--card); border-bottom: 1px solid #2a2a3a; }
.cmd-btn { padding: 5px 11px; border: none; border-radius: 6px; background: linear-gradient(90deg, var(--cyan), var(--lime)); color: #0a0a12; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
.cmd-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.fb-layout { display: grid; grid-template-columns: 240px 1fr 260px; gap: 16px; max-width: 1400px; margin: 0 auto; padding: 16px; }
.sidebar { background: var(--sidebar); border-radius: 12px; padding: 14px; border: 1px solid #2a2a3a; height: fit-content; position: sticky; top: 110px; max-height: calc(100vh - 140px); overflow-y: auto; }
.sidebar h3 { font-size: 0.95rem; color: var(--cyan); margin-bottom: 10px; }
.sidebar .item { padding: 8px 10px; border-radius: 8px; margin-bottom: 4px; font-size: 0.88rem; color: var(--text); cursor: pointer; }
.sidebar .item:hover { background: #222; }
.sidebar .item.sub { padding-left: 24px; font-size: 0.85rem; cursor: pointer; }
.sidebar .item.header { cursor: default; font-weight: 700; color: var(--cyan); }
.sidebar .item.header:hover { background: transparent; }
.middle { min-height: 100vh; }
.section { display: none; }
.section.active { display: block; }
.center-attraction { text-align: center; margin: 20px 0; padding: 20px; background: var(--card); border-radius: 12px; border: 2px solid var(--cyan); }
.center-attraction h2 { color: var(--lime); margin-bottom: 10px; }
.tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.tab { padding: 5px 12px; border-radius: 16px; background: #222; color: var(--text); border: none; cursor: pointer; font-size: 0.8rem; }
.tab.active { background: var(--purple); color: white; }
.comments-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 20px; }
.comment-row { display: flex; align-items: center; gap: 8px; background: var(--card); padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(0,245,255,0.12); transition: opacity 0.35s, transform 0.35s; }
.comment-row.vanishing { opacity: 0; transform: translateY(-6px) scale(0.97); }
.comment-text { flex: 1; font-size: 0.9rem; line-height: 1.35; }
.copy-btn { background: var(--lime); color: #0a0a12; border: none; padding: 5px 9px; border-radius: 5px; font-weight: 700; font-size: 0.75rem; cursor: pointer; min-width: 54px; }
.copy-btn.copied { background: var(--gold); }
.bypass-btn { background: var(--orange); color: white; border: none; padding: 4px 8px; border-radius: 5px; font-size: 0.7rem; cursor: pointer; margin-left: 6px; display: none; }
.bypass-btn.show { display: inline-block; }
.number-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px,1fr)); gap: 5px; max-height: 280px; overflow-y: auto; margin-bottom: 10px; }
.num-btn { background: #222; border: 1px solid var(--cyan); color: var(--cyan); padding: 6px 2px; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 0.82rem; }
.num-btn.selected { background: var(--cyan); color: #0a0a12; }
.guess-box { text-align: center; margin: 8px 0; padding: 10px; background: #111; border-radius: 8px; border: 1px solid var(--lime); font-family: monospace; font-size: 1.15rem; }
.custom-cmd { padding: 12px; background: var(--card); border-radius: 10px; text-align: center; }
.custom-cmd input { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--purple); background: #111; color: white; margin: 6px 0; width: 100%; }
.recent-cmds { margin-top: 12px; }
.recent-cmds .cmd-item { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 0.85rem; border-bottom: 1px solid #222; gap: 6px; }
.recent-cmds .cmd-actions { display: flex; gap: 4px; }
.small-copy { background: var(--lime); color: #0a0a12; border: none; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; font-weight: 700; }
.del-btn { background: #ff4444; color: white; border: none; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; }
#deleteAllCustom { cursor: pointer; }
#dragonCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; opacity: 0.65; }
@media (max-width: 1000px) { .fb-layout { grid-template-columns: 1fr; } .sidebar { position: static; } }
</style>
</head>

<canvas id="dragonCanvas"></canvas>
<div class="top-nav">
  <button class="nav-btn active" data-section="faded">Faded Monsuta</button>
  <button class="nav-btn" data-section="popin">PopInStock</button>

<div class="commands-bar" id="commandsBar"></div>
<div class="fb-layout">

    <h3>Quick Links</h3>

  </aside>
  <main class="middle">
    <section class="section active" id="faded">
      <div class="center-attraction" id="digCenter">

        <button class="bypass-btn" id="bypassDig">Bypass timer?</button>
        <div id="digCooldown" class="cooldown" style="margin-top:8px;"></div>
      </div>
      <h4 id="categoriesHeader" style="margin:16px 0 8px; color:var(--cyan); text-align:center;">Categories</h4>

      </div>
      <div class="comments-list" id="fadedComments"></div>
      <h4 id="digReactionsHeader" style="margin:16px 0 8px; color:var(--gold); text-align:center;">NFT Dig Reactions</h4>
      <div id="digReactionsContainer"></div>
      <h4 id="successDigHeader" style="margin:24px 0 8px; color:var(--lime); text-align:center;">Successful Digs</h4>
      <div class="comments-list" id="successDigs"></div>
      <h4 id="failDigHeader" style="margin:24px 0 8px; color:var(--orange); text-align:center;">Fail Digs</h4>
      <div class="comments-list" id="failDigs"></div>
    </section>
    <section class="section" id="popin">
      <div class="center-attraction" id="guessCenter">
        <h2>Choose a number from 1 to 99</h2>
        <div class="number-grid" id="numberGrid"></div>
        <div class="guess-box" id="guessOutput">Select a number</div>
        <button class="copy-btn" id="copyGuess" style="padding:8px 16px;">Copy !guess</button>
        <button class="bypass-btn" id="bypassGuess">Bypass timer?</button>
        <span class="cooldown" id="guessCooldown"></span>
      </div>
      <h4 id="winHeader" style="text-align:center; margin:12px 0 8px; color:var(--magenta);">Win Comments</h4>
      <div class="comments-list" id="winComments"></div>
      <h4 id="successGuessHeader" style="margin:24px 0 8px; color:var(--lime); text-align:center;">Successful Guesses</h4>
      <div class="comments-list" id="successGuesses"></div>
      <h4 id="unluckyHeader" style="margin:24px 0 8px; color:var(--orange); text-align:center;">Unsuccessful Guesses</h4>
      <div class="comments-list" id="unluckyGuesses"></div>
    </section>
  </main>
  <aside class="sidebar">
    <h3>Custom Command</h3>
    <div class="custom-cmd">
      <input type="text" id="customWord" placeholder="type word (eg play)">
      <button class="cmd-btn" style="width:100%; margin-top:6px;" id="generateBtn">Generate</button>
      <div id="customResult" style="margin-top:8px; font-family:monospace; color:var(--cyan); font-size:0.9rem;"></div>
      <button class="copy-btn" id="copyCustomBtn" style="margin-top:6px; display:none; width:100%;">Copy Command</button>
    </div>
    <div class="recent-cmds">
      <h3 style="margin-top:16px;">Recent Custom Commands</h3>
      <div id="recentCustomList"></div>
      <button class="del-btn" id="deleteAllCustom" style="width:100%; margin-top:8px; padding:6px;">Delete entire database</button>
    </div>
    <h3 style="margin-top:16px;">About</h3>
    <div id="aboutSection"></div>
  </aside>
</div>

function getCooldown(key){ const u = localStorage.getItem(key); return u ? parseInt(u) : 0; }
function setCooldown(key, ms){ localStorage.setItem(key, Date.now() + ms); }
function isOnCooldown(key){ return Date.now() < getCooldown(key); }
function remaining(key){
  const r = getCooldown(key) - Date.now();
  if(r <= 0) return "";
  const m = Math.floor(r / 60000);
  const s = Math.ceil((r % 60000) / 1000);
  return m + "m " + s + "s";
}
function bypassTimer(key){

  updateDigCenter();

  updateCommandsBar();
}

const canvas = document.getElementById("dragonCanvas");
const ctx = canvas.getContext("2d");
let mx = window.innerWidth/2, my = window.innerHeight/2;
let segments = [];
const SEG_COUNT = 12, SEG_DIST = 14;
function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener("resize", resize); resize();
document.addEventListener("mousemove", e => { mx = e.clientX; my = e.clientY; });
function initSegments(){ segments = []; for(let i=0;i<SEG_COUNT;i++) segments.push({x:mx,y:my,angle:0}); }
initSegments();
let walkPhase = 0;
function updateDragon(){
  const head = segments[0];
  head.x += (mx - head.x) * 0.04;
  head.y += (my - head.y) * 0.04;
  head.angle = Math.atan2(my - head.y, mx - head.x);
  for(let i=1;i<segments.length;i++){
    const prev = segments[i-1], curr = segments[i];
    const dx = prev.x - curr.x, dy = prev.y - curr.y;
    const ang = Math.atan2(dy, dx);
    curr.x = prev.x - Math.cos(ang) * SEG_DIST;
    curr.y = prev.y - Math.sin(ang) * SEG_DIST;
    curr.angle = ang;
  }
  walkPhase += 0.12;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save(); ctx.globalAlpha = 0.75;
  for(let i=segments.length-1;i>=0;i--){
    const s = segments[i];
    const size = 10 + (segments.length - i)*1.2;
    ctx.beginPath(); ctx.arc(s.x, s.y, size*0.45, 0, Math.PI*2);
    ctx.fillStyle = i===0 ? "#4da6ff" : "#66b3ff"; ctx.fill();
    if(i>1 && i<7){
      const phase = walkPhase + i*0.8;
      const side = (i%2===0)?1:-1;
      const lx = s.x + Math.cos(s.angle + side*1.2)*(size*0.6 + Math.sin(phase)*6);
      const ly = s.y + Math.sin(s.angle + side*1.2)*(size*0.6 + Math.sin(phase)*6);
      ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(lx,ly);
      ctx.strokeStyle="#4da6ff"; ctx.lineWidth=3; ctx.stroke();
    }
  }
  const h = segments[0];
  ctx.fillStyle="#2a7fff";
  ctx.beginPath(); ctx.arc(h.x+Math.cos(h.angle)*8, h.y+Math.sin(h.angle)*8, 9, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle="#0a0a12";
  ctx.beginPath();
  ctx.arc(h.x+Math.cos(h.angle+0.5)*6, h.y+Math.sin(h.angle+0.5)*6, 2.5, 0, Math.PI*2);
  ctx.arc(h.x+Math.cos(h.angle-0.5)*6, h.y+Math.sin(h.angle-0.5)*6, 2.5, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  requestAnimationFrame(updateDragon);
}
updateDragon();

function copyText(text, btn){
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = "COPIED";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = orig; btn.classList.remove("copied"); }, 1000);
  }).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
    const orig = btn.textContent; btn.textContent = "COPIED"; btn.classList.add("copied");
    setTimeout(() => { btn.textContent = orig; btn.classList.remove("copied"); }, 1000);
  });
}

function makeRow(text, onCopy){
  const row = document.createElement("div");
  row.className = "comment-row";
  row.innerHTML = `<div class="comment-text">${text}</div><button class="copy-btn">Copy</button>`;
  row.querySelector(".copy-btn").onclick = (e) => {
    copyText(text, e.target);
    row.classList.add("vanishing");
    setTimeout(() => onCopy(row), 400);
  };
  return row;
}

function renderList(containerId, pool, indexRef, showCount=50){
  const cont = document.getElementById(containerId);
  if(!cont) return;
  cont.innerHTML = "";
  const list = pool;
  const show = Math.min(showCount, list.length);
  for(let i = 0; i < show; i++){
    const idx = (indexRef.value + i) % list.length;
    const row = makeRow(list[idx], (oldRow) => {
      indexRef.value = (indexRef.value + 1) % list.length;
      const newIdx = indexRef.value % list.length;
      const newRow = makeRow(list[newIdx], arguments.callee);
      oldRow.replaceWith(newRow);
    });
    cont.appendChild(row);
  }
}

function renderFaded(){
  const cont = document.getElementById("fadedComments");
  cont.innerHTML = "";
  const list = fadedPool[currentFadedCat] || fadedPool.all;
  const show = Math.min(50, list.length);
  for(let i = 0; i < show; i++){
    const idx = (fadedIndices[currentFadedCat] + i) % list.length;
    const row = makeRow(list[idx], (oldRow) => {
      fadedIndices[currentFadedCat] = (fadedIndices[currentFadedCat] + 1) % list.length;
      const newIdx = fadedIndices[currentFadedCat] % list.length;
      const newRow = makeRow(list[newIdx], arguments.callee);
      oldRow.replaceWith(newRow);
    });
    cont.appendChild(row);
  }
}

}
document.getElementById("copyGuess").onclick = function(){
  if(!selectedNumber) return alert("Pick a number first");
  const key = "popin-!guess";
  if(isOnCooldown(key)){ alert("!guess on cooldown"); return; }
  const cmd = "!guess " + selectedNumber;
  copyText(cmd, this);
  setCooldown(key, 5*60*1000);
  updateGuessCooldown();
};

function renderWin(){
  const cont = document.getElementById("winComments");
  cont.innerHTML = "";
  const show = Math.min(50, winComments.length);
  for(let i = 0; i < show; i++){
    const idx = (winIndex + i) % winComments.length;
    const row = makeRow(winComments[idx], (oldRow) => {
      winIndex = (winIndex + 1) % winComments.length;
      const newIdx = winIndex % winComments.length;
      const newRow = makeRow(winComments[newIdx], arguments.callee);
      oldRow.replaceWith(newRow);
    });
    cont.appendChild(row);
  }
}

function saveRecent(){
  localStorage.setItem("recentCustom", JSON.stringify(recentCustom));
  renderRecentCustom();
}
document.getElementById("deleteAllCustom").onclick = () => {
  if(confirm("Are you sure you want to delete the entire custom commands database? This cannot be undone.")){
    recentCustom = [];
    saveRecent();
  }
};
function renderRecentCustom(){
  const cont = document.getElementById("recentCustomList");
  cont.innerHTML = "";
  recentCustom.forEach((cmd, i) => {
    const div = document.createElement("div");
    div.className = "cmd-item";
    div.innerHTML = `
      <span>${cmd}</span>
      <div class="cmd-actions">
        <button class="small-copy" data-i="${i}">Copy</button>
        <button class="del-btn" data-i="${i}">Delete</button>
      </div>
    `;
    div.querySelector(".small-copy").onclick = (e) => {
      copyText(cmd, e.target);
    };
    div.querySelector(".del-btn").onclick = () => {
      if(confirm("Are you sure you want to delete this custom command from the database?")){
        recentCustom.splice(i, 1);
        saveRecent();
      }
    };
    cont.appendChild(div);
  });
}
function generateCustom(){
  const word = document.getElementById("customWord").value.trim().replace(/[^a-zA-Z0-9]/g,"");
  if(!word) return alert("Enter a word first");
  lastCustomCmd = "!" + word.toLowerCase();
  document.getElementById("customResult").textContent = lastCustomCmd;
  document.getElementById("copyCustomBtn").style.display = "block";
  document.getElementById("customWord").value = "";
  if(!recentCustom.includes(lastCustomCmd)){
    recentCustom.unshift(lastCustomCmd);
    if(recentCustom.length > 20) recentCustom.pop();
    saveRecent();
  }
}
document.getElementById("generateBtn").onclick = generateCustom;
document.getElementById("customWord").addEventListener("keypress", e => { if(e.key === "Enter") generateCustom(); });
document.getElementById("copyCustomBtn").onclick = function(){
  if(!lastCustomCmd) return;
  copyText(lastCustomCmd, this);
};

setInterval(() => { updateDigCenter(); updateGuessCooldown(); }, 1000);
const last = localStorage.getItem("lastSection") || "faded";
switchSection(last);
window.scrollTo(0, 0);

renderNumbers();
renderWin();

renderFailDigs();
renderSuccessGuesses();
renderUnlucky();
updateCommandsBar();
updateSidebar();
updateDigCenter();
renderRecentCustom();
